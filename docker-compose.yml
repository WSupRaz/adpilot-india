version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: adpilot_postgres
    environment:
      POSTGRES_USER: adpilot
      POSTGRES_PASSWORD: adpilot_dev
      POSTGRES_DB: adpilot_india
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpilot -d adpilot_india"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adpilot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
